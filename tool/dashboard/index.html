<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>wallp Theme Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Creepster&family=Playfair+Display:wght@400;700&family=Baloo+2:wght@400;700&family=Bebas+Neue&family=Orbitron:wght@400;700&family=Space+Grotesk:wght@400;500&family=DM+Sans:wght@400;500&family=Padauk:wght@400;700&display=swap">
<style>
/* Layout: fixed left rail of catalog sections, a working area of tables and phone-sized cards, editors open as wide sheets. */
:root{
  --bg:#F3F2F7; --panel:#FFFFFF; --panel-2:#EBE9F2; --line:#DAD6E4; --fg:#1C1828; --muted:#625C73;
  --accent:#5B3FD0; --accent-fg:#FFFFFF; --accent-soft:#E9E4FB;
  --ok:#1D7449; --ok-soft:#DDF2E7; --warn:#8E5400; --warn-soft:#FBEBCF; --bad:#B42335; --bad-soft:#F8DDE1; --info:#2C5FA8; --info-soft:#DFE9F8;
  --shadow:0 1px 2px rgba(28,24,40,.06),0 8px 24px rgba(28,24,40,.08);
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131119; --panel:#1B1823; --panel-2:#25212F; --line:#342F42; --fg:#ECE9F3; --muted:#A39DB3;
  --accent:#A894FF; --accent-fg:#17122B; --accent-soft:#2C2547;
  --ok:#5BD39A; --ok-soft:#163828; --warn:#F1B85A; --warn-soft:#3A2C12; --bad:#FF8593; --bad-soft:#3E1A22; --info:#8DB8FF; --info-soft:#1A2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131119; --panel:#1B1823; --panel-2:#25212F; --line:#342F42; --fg:#ECE9F3; --muted:#A39DB3;
  --accent:#A894FF; --accent-fg:#17122B; --accent-soft:#2C2547;
  --ok:#5BD39A; --ok-soft:#163828; --warn:#F1B85A; --warn-soft:#3A2C12; --bad:#FF8593; --bad-soft:#3E1A22; --info:#8DB8FF; --info-soft:#1A2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:30%;background:linear-gradient(160deg,#FF7A1A,#5B3FD0 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

.main{min-width:0;padding-block:22px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap}
.chip.demo{border-style:dashed}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.grid{display:grid;gap:16px}
.g-over{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h2 .muted{font-family:var(--f-body);font-weight:400;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{background:var(--panel-2);color:var(--muted)}
.s-review{background:var(--info-soft);color:var(--info)}
.s-ready{background:var(--accent-soft);color:var(--accent)}
.s-published{background:var(--ok-soft);color:var(--ok)}
.s-archived{background:var(--panel-2);color:var(--muted);text-decoration:line-through}
.live{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--panel-2);color:var(--muted)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.lvl.error{background:var(--bad-soft);color:var(--bad)}
.lvl.warning{background:var(--warn-soft);color:var(--warn)}
.lvl.info{background:var(--info-soft);color:var(--info)}
.note{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--panel-2) 50%,transparent)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);vertical-align:-2px}
.sws{display:inline-flex;gap:3px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters select,.filters input,.field input:not([type=checkbox]):not([type=color]),.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{min-width:min(220px,100%)}

.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
.tcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.tcard:hover .ph{transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard .meta{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.tcard .name{font-weight:600}
.tcard .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

.ph{position:relative;overflow:hidden;flex:none;transition:transform .15s,box-shadow .15s;box-shadow:0 0 0 1px rgba(127,127,127,.25)}
.ph-in{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}
.ph-in .abs{position:absolute}
.tile{display:grid;place-items:center;font-weight:600;font-family:'IBM Plex Sans',system-ui,sans-serif;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,18,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:40;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(1120px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;margin:auto 0}
.sheet.narrow{width:min(640px,100%)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h h3{font-family:var(--f-display);font-size:19px;margin:0;flex:1;min-width:0}
.sheet-b{padding:18px;min-width:0}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 14px 14px;position:sticky;bottom:0}
.sheet-f .grow{flex:1}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.ed-prev{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.fs{border:0;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.fs legend{font-family:var(--f-display);font-weight:700;font-size:14px;padding:0 0 8px;grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.field .hint{font-size:11.5px;color:var(--muted)}
.field.wide{grid-column:1/-1}
.field.check{flex-direction:row;align-items:center;gap:8px}
.cfield{display:flex;gap:6px;align-items:center}
.cfield input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--panel);flex:none}
.cfield input[type=text]{flex:1;font-family:var(--f-mono);font-size:12.5px;width:100%}
.cr{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.cr.ok{background:var(--ok-soft);color:var(--ok)}
.cr.warn{background:var(--warn-soft);color:var(--warn)}
.cr.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.acc-list{display:flex;flex-wrap:wrap;gap:8px}
.acc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 3px;font-size:12.5px;background:var(--panel)}
.acc .dot{width:20px;height:20px;border-radius:50%}
.acc button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.pre{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:60vh;font-family:var(--f-mono);font-size:12px;white-space:pre}

.fest-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line)}
.fest-badge{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;text-align:center;line-height:1.05}
.big{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kpi{padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

.font-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.font-row:last-child{border-bottom:0}
.font-sample{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.font-clock{font-size:26px;font-variant-numeric:tabular-nums}

.pack{display:flex;flex-direction:column;gap:10px}
.pack-stage{border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;justify-items:center}
.pack-stage .lbl{font-size:11px;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}

.carousel{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.banner{scroll-snap-align:start;flex:none;width:min(340px,82vw);height:168px;border-radius:18px;position:relative;overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.banner .b-tag{font-size:10.5px;letter-spacing:.1em;font-weight:700;opacity:.85}
.banner .b-title{font-size:26px;line-height:1.05;max-width:62%}
.banner .b-sub{font-size:12px;opacity:.85;max-width:60%;margin-top:4px}
.banner .b-cta{align-self:flex-start;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600}
.banner .b-art{position:absolute;right:-6px;top:-10px;opacity:.95;pointer-events:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

.opts{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.opt{display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.opt .btns{justify-content:center}
.steps{display:flex;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.steps b{color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.slot{display:flex;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;align-items:flex-start;background:var(--panel)}
.slot-pic{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);border:1px dashed var(--line);text-align:center}
.slot-pic.tall{height:138px;border-radius:10px}
.slot-pic.tile{border-radius:30%}
.slot-pic img{width:100%;height:100%;object-fit:cover}
.slot-pic .ph{box-shadow:none}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.layer .row{flex-wrap:wrap}
.lthumb{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);display:inline-block}
.checker{background-color:var(--panel);background-image:conic-gradient(var(--panel-2) 25%,transparent 0 50%,var(--panel-2) 0 75%,transparent 0);background-size:14px 14px}
.tilethumb{width:76px;height:76px;border-radius:30%;object-fit:cover;flex:none}
.tilethumb.empty{display:grid;place-items:center;font-size:11px;color:var(--muted);border:1px dashed var(--line)}
.wallthumb{width:92px;aspect-ratio:9/19.5;border-radius:12px;object-fit:cover;flex:none}
.drop{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:22px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input,.upl input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upl{position:relative}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.libitem{display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;font-size:12px;min-width:0}
.libitem:hover{border-color:var(--accent)}
.libitem img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:6px}
.libitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pfall{to{transform:translateY(844px)}}
@keyframes prise{to{transform:translateY(-844px)}}
.p-fall{animation:pfall linear infinite}
.p-rise{animation:prise linear infinite}
@keyframes twinkle{50%{opacity:.3}}
.p-twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes drift{50%{transform:translateX(14px)}}
.p-drift{animation:drift 6s ease-in-out infinite}
.mo-pulse,.mo-float,.mo-sway{transform-box:fill-box}
.mo-pulse{transform-origin:center;animation:mpulse 4s ease-in-out infinite}
@keyframes mpulse{50%{transform:scale(1.05)}}
.mo-float{animation:mfloat 5s ease-in-out infinite}
@keyframes mfloat{50%{transform:translateY(-12px)}}
.mo-sway{transform-origin:top center;animation:msway 4s ease-in-out infinite}
@keyframes msway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-sec{display:none}
  .nav a{white-space:nowrap;gap:6px}
  .rail-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-prev{position:static;order:-1}
  .font-row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><b>wallp</b><small>Theme Dashboard</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div><b style="color:var(--fg)">You</b> · Admin</div>
      <div>Demo session. Changes stay in this browser.</div>
      <button class="btn sm" data-act="resetAsk">Reset demo data</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>

}

/* ---------- generator (section 5.2) ---------- */
const NAME_WORDS = {
  mood:{classic:['Midnight','Deep','Royal','Old'],cozy:['Warm','Quiet','Amber','Soft'],minimal:['Still','Plain','Calm','Clean'],cute:['Little','Sweet','Candy','Happy']},
  fest:{halloween:['Pumpkin','Lantern','Raven','Crypt','Ghost','Moon'],christmas:['Pines','Star','Cabin','Snow','Ornament','Candle'],thingyan:['Splash','Padauk','Water','Sun','Bowl','Drum'],heroes:['Skyline','Rooftop','Signal','Patrol','Swing','City'],neon:['Grid','Arcade','Horizon','Pulse','Drive','Glow']}
};
function genTheme(inp, seed){
  const r = rng(seed * 7919 + 13), fest = byId('festivals', inp.festivalId), mood = inp.mood || 'classic';
  const base = isHex(inp.base) ? inp.base : (fest?.look?.brand || '#FF7A1A');
  const b = hexToOklch(base);
  const baseHue = inp.hue ?? (isHex(inp.base) || !fest?.look?.background ? b.h : hexToOklch(fest.look.background).h);
  const hue = (baseHue + (r()-.5)*28 + 360) % 360;
  const k = {classic:.055,cozy:.05,minimal:.022,cute:.075}[mood];
  const bgL = .18 + r()*.06, bg = oklch(bgL, k*(.8+r()*.5), hue);
  const deep = oklch(.12 + r()*.04, k*(.9+r()*.4), hue);
  const surface = oklch(.28 + r()*.06, k*1.25, hue);
  const text = oklch(.955, mood === 'minimal' ? .01 : .025, (hue + (mood === 'cozy' ? 25 : 0)) % 360);
  const textMuted = oklch(.80, .03, hue);
  const ah = ([b.h, b.h + 32, b.h + 180, b.h - 40][seed % 4] + 360) % 360;
  const aC = mood === 'minimal' ? .11 : .17, aL = mood === 'cute' ? .80 : .74 + r()*.06;
  const acc = oklch(aL, aC, ah), acc2 = oklch(.78, aC*.9, (ah + 70) % 360), accG = oklch(.62, aC*1.05, (ah + 335) % 360);
  const displays = S.cat.fonts.filter(f => f.category === 'display').map(f => f.id);
  const pref = fest?.look?.displayFont;
  const order = pref ? [pref, ...displays.filter(x => x !== pref)] : displays;
  const display = order[(seed % 3 === 0 ? 0 : seed) % order.length];
  const body = inp.festivalId === 'thingyan' ? 'padauk' : ['space-grotesk','dm-sans'][seed % 2];
  const pack = S.cat.iconPacks.find(p => p.festivalId === inp.festivalId && p.status !== 'archived');
  const engine = inp.picture ? 'layers' : ENGINES.find(e => e.id === inp.festivalId) ? inp.festivalId : 'layers';
  const cover = byId('themes', fest?.coverThemeId);
  let scene;
  if (inp.picture) {
    const ls = [{type:'gradient',colors:['@background','@deep'],angle:180},{type:'image',image:clone(inp.picture),fit:'cover',anchor:'center'}];
    if (inp.particles) ls.push({type:'particles',effect:inp.particles,count:inp.particles === 'rain' ? 60 : 40,color:'@text',speed:.4,size:.35,opacity:.7});
    scene = {engine:'layers', params:{layers:ls}};
  } else if (engine === 'layers') {
    scene = Array.isArray(cover?.scene?.params?.layers) ? clone(cover.scene) : {engine:'layers', params:{layers:starterLayers(true)}};
    if (inp.particles) scene.params.layers.push({type:'particles',effect:inp.particles,count:40,color:'@text',speed:.4,size:.35,opacity:.7});
  } else scene = {engine, params:{}};
  const w = NAME_WORDS.mood[mood], n = NAME_WORDS.fest[inp.festivalId] || ['Night','Glow','Sky','Dream','Light','Wave'];
  const name = `${w[Math.floor(r()*w.length)]} ${n[Math.floor(r()*n.length)]}`;
  return {
    id: name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + (seed % 1000),
    rev: 0, festivalId: inp.festivalId, name:{en:name}, style: mood,
    tags: [mood, ...(inp.festivalId ? [inp.festivalId] : [])],
    isLive: sceneLive(scene), minAppVersion:'1.0.0', scene,
    palette:{background:bg, deep, surface, text, textMuted, ...(engine === 'layers' ? {motif:acc} : {})},
    accents:[{id:'accent',name:{en:'Accent'},type:'solid',colors:[acc]},{id:'second',name:{en:'Second'},type:'solid',colors:[acc2]},{id:'glow',name:{en:'Glow'},type:'gradient',colors:[acc,accG],angle:135}],
    fonts:{display, body, labels:display}, clock:{useAccent: seed % 2 === 0}, labels:{color:text},
    iconPackId: pack?.id, wallpaperIds: [], _hue: hue
  };
}

/* ---------- state ---------- */

  S = {cat, releases:[], audit:[], staging:null, assets:{}};

  Object.assign(ex, {id:'pumpkin-patch', name:{en:'Pumpkin Patch'}, status:'review', example:true, generatedFrom:{festivalId:'halloween',mood:'cozy',base:'#E07A2A',seed:4}, updatedAt:new Date().toISOString(), updatedBy:'Example designer'});
  delete ex._hue;

}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); S.assets = JSON.parse(localStorage.getItem(AKEY) || '{}'); return; } } catch(e){}
  fresh();
}

const META = ['status','liveCopy','updatedAt','updatedBy','example','generatedFrom','_hue'];
function strip(x){ const o = clone(x); META.forEach(k => delete o[k]); return o; }

  KINDS.forEach(k => out[k] = cat[k].map(x => (x.status === 'published' || x.status === 'ready') ? strip(x) : (x.liveCopy && x.status !== 'archived') ? clone(x.liveCopy) : null).filter(Boolean));
  out.accentPresets = clone(cat.accentPresets); out.searchSuggestions = [...cat.searchSuggestions];

}
const current = () => S.releases.find(r => r.current);
const cmpKey = x => { const o = clone(x); delete o.rev; delete o.publishedAt; return JSON.stringify(o); };
function diff(a, b){
  const out = [];
  KINDS.forEach(k => {
    const bm = new Map(b[k].map(x => [x.id, x]));
    a[k].forEach(x => { const o = bm.get(x.id); if (!o) out.push({op:'+', kind:k, id:x.id, name:L(x.name)||x.family||L(x.title)}); else if (cmpKey(o) !== cmpKey(x)) out.push({op:'~', kind:k, id:x.id, name:L(x.name)||x.family||L(x.title), rev: k === 'themes' ? [o.rev, o.rev+1] : null}); bm.delete(x.id); });
    bm.forEach(o => out.push({op:'−', kind:k, id:o.id, name:L(o.name)||o.family||L(o.title)}));
  });
  if (JSON.stringify(a.accentPresets) !== JSON.stringify(b.accentPresets)) out.push({op:'~', kind:'store', id:'accentPresets', name:'Accent presets'});
  if (JSON.stringify(a.searchSuggestions) !== JSON.stringify(b.searchSuggestions)) out.push({op:'~', kind:'store', id:'searchSuggestions', name:'Popular searches'});

}
function summary(ch){
  const c = {}; ch.forEach(x => { const key = (x.op === '+' ? '+' : x.op === '−' ? '−' : '~') + (x.kind === 'store' ? 'store setting' : KIND_LABEL[x.kind].toLowerCase()); c[key] = (c[key]||0) + 1; });
  return Object.entries(c).map(([k,n]) => `${k[0] === '~' ? '' : k[0]}${n} ${k.slice(1)}${n > 1 ? 's' : ''}${k[0] === '~' ? ' edited' : ''}`).join(', ') || 'No changes';
}

const everReleased = (kind, id) => S.releases.some(r => r.snap[kind]?.some(x => x.id === id));

/* ---------- festivals: dates ---------- */
function nextDate(f){
  if (f.kind !== 'festival') return null;
  const t = today0(), dur = f.durationDays || 1;
  const occ = (f.occurrences || []).map(d => new Date(d + 'T00:00:00')).filter(d => +d + (dur-1)*864e5 >= +t).sort((a,b) => a-b);
  let d = occ[0], fromTable = !!d;
  if (!d && f.fallbackDate) { d = new Date(t.getFullYear(), f.fallbackDate.month-1, f.fallbackDate.day); if (+d + (dur-1)*864e5 < +t) d = new Date(t.getFullYear()+1, f.fallbackDate.month-1, f.fallbackDate.day); }
  if (!d) return null;
  const days = Math.max(0, Math.round((d - t)/864e5));
  const futureCount = (f.occurrences || []).filter(x => new Date(x + 'T00:00:00') >= t).length;
  return {date:d, days, fromTable, futureCount};
}
function countdownText(f){
  const n = nextDate(f); if (!n) return 'Any time';
  if (n.days === 0) return `${L(f.name)} is today`;
  const u = f.unit === 'night' ? 'night' : 'day';
  return `${L(f.name)} in ${n.days} ${u}${n.days === 1 ? '' : 's'}`;
}
const themeCounts = fid => { const ts = S.cat.themes.filter(t => t.festivalId === fid); return {pub: ts.filter(t => t.status === 'published' || t.liveCopy).length, draft: ts.filter(t => ['draft','review','ready'].includes(t.status)).length}; };

/* ---------- checks (section 6) ---------- */
function runChecks(pub){
  const out = [], push = (level, kind, id, msg) => out.push({level, kind, id, msg});
  const ids = k => new Set(pub[k].map(x => x.id));
  const fonts = ids('fonts'), packs = ids('iconPacks'), fests = ids('festivals'), walls = ids('wallpapers'), themes = ids('themes');
  pub.themes.forEach(t => {
    const p = t.palette || {}, n = L(t.name);
    const r1 = contrast(p.text, p.background); if (r1 < 4.5) push('error','themes',t.id,`${n}: text colour on background is ${r1.toFixed(1)}:1, needs 4.5:1`);
    const r2 = contrast(p.textMuted, p.background); if (r2 < 4.5) push('warning','themes',t.id,`${n}: muted text on background is ${r2.toFixed(1)}:1, aim for 4.5:1`);
    const lc = t.labels?.color || '#FFFFFF', r3 = contrast(lc, p.background); if (r3 < 4.5) push('warning','themes',t.id,`${n}: app name colour on background is ${r3.toFixed(1)}:1, aim for 4.5:1`);
    const a = t.accents?.[0]; if (!a) push('error','themes',t.id,`${n}: needs at least one accent`); else { const r4 = contrast(a.colors[0], p.background); if (r4 < 3) push('warning','themes',t.id,`${n}: default accent on background is ${r4.toFixed(1)}:1, aim for 3:1`); }
    if (!fests.has(t.festivalId)) push('error','themes',t.id,`${n}: festival "${t.festivalId}" isn't in this release`);
    ['display','body','labels'].forEach(r => { const f = t.fonts?.[r]; if (f && !fonts.has(f)) push('error','themes',t.id,`${n}: ${r} font "${f}" isn't in this release`); });
    if (t.iconPackId && !packs.has(t.iconPackId)) push('error','themes',t.id,`${n}: icon pack "${t.iconPackId}" isn't in this release`);
    (t.wallpaperIds||[]).forEach(w => { if (!walls.has(w)) push('error','themes',t.id,`${n}: wallpaper "${w}" isn't in this release`); });
    if (!ENGINES.some(e => e.id === t.scene?.engine)) push('error','themes',t.id,`${n}: engine "${t.scene?.engine}" isn't in engines.json`);
    const lf = pub.fonts.find(f => f.id === (t.fonts?.labels || t.fonts?.display));
    if (lf && !lf.scripts?.includes('myanmar') && !lf.fallbackFor?.my) push('error','themes',t.id,`${n}: app name font ${lf.family} has no Myanmar letters and no fallback`);
  });
  const layerCheck = (owner, kind, id, scene, isWall) => {
    if (scene?.engine !== 'layers') return;
    const ls = scene.params?.layers;
    if (!Array.isArray(ls) || !ls.length) return push('error', kind, id, `${owner}: the layers scene has no layers`);
    ls.forEach((l, i) => {
      const at = `${owner}, layer ${i+1}`, cols = [...(l.colors || []), l.color].filter(Boolean);
      if (l.type === 'particles' && !((l.count ?? 0) >= 1 && l.count <= 150)) push('error', kind, id, `${at}: particle count must be 1–150`);
      if (l.type === 'particles' && !EFFECTS.includes(l.effect)) push('error', kind, id, `${at}: unknown particle effect "${l.effect}"`);
      if (l.type === 'shape' && ([l.x, l.y].some(v => v < -.5 || v > 1.5) || !(l.width > 0 && l.width <= 3))) push('error', kind, id, `${at}: centre must be -0.5–1.5 and width above 0, up to 3`);
      if (l.type === 'image' && !assetOf(l.image)) push('error', kind, id, `${at}: the picture is missing`);
      if (l.opacity != null && (l.opacity < 0 || l.opacity > 1)) push('error', kind, id, `${at}: opacity must be 0–1`);
      if (isWall && cols.some(c => c[0] === '@')) push('error', kind, id, `${at}: wallpapers have no palette, so ${cols.find(c => c[0] === '@')} can't be used`);
      cols.forEach(c => { if (!isHex(c) && !TOKEN_RE.test(c)) push('error', kind, id, `${at}: "${c}" isn't a colour`); });
    });
  };
  pub.themes.forEach(t => {
    const n = L(t.name);
    layerCheck(n, 'themes', t.id, t.scene, false);
    const cover = (t.scene?.params?.layers || []).find(l => l.type === 'image' && l.fit === 'cover'), top = assetOf(cover?.image)?.topColor;
    if (top) { const r = contrast(t.palette?.text, top); if (r < 4.5) push('warning', 'themes', t.id, `${n}: clock colour on the top of the picture is ${r.toFixed(1)}:1, aim for 4.5:1`); }
  });
  pub.wallpapers.forEach(w => {
    const n = L(w.name);
    if (w.kind === 'image') {
      const sz = w.image?.sizes || [];
      if (!sz.length) return push('error', 'wallpapers', w.id, `${n}: picture wallpaper has no picture`);
      sz.forEach(s => { if (!assetOf(s.asset)) push('error', 'wallpapers', w.id, `${n}: the ${s.width} px file is missing`); if (s.asset.bytes > 1e6) push('warning', 'wallpapers', w.id, `${n}: the ${s.width} px file is ${kb(s.asset.bytes)}, over 1 MB`); });
      const big = Math.max(...sz.map(s => s.width)); if (big < 1440) push('warning', 'wallpapers', w.id, `${n}: largest size is ${big} px wide, aim for 1440`);
      if (!w.image.blurhash) push('warning', 'wallpapers', w.id, `${n}: no blurhash, so the app shows a plain colour while it downloads`);
      const top = assetOf(sz[0].asset)?.topColor; if (top && contrast('#FFFFFF', top) < 3) push('warning', 'wallpapers', w.id, `${n}: the top of the picture is too bright for the white clock (${contrast('#FFFFFF', top).toFixed(1)}:1)`);
    } else layerCheck(n, 'wallpapers', w.id, w.scene, true);
  });
  pub.iconPacks.forEach(p => {
    const a = assetOf(p.background); if (!a) { if (p.kind === 'images' && p.background) push('error', 'iconPacks', p.id, `${L(p.name)}: tile picture file is missing`); return; }
    if (a.width !== a.height) push('error', 'iconPacks', p.id, `${L(p.name)}: tile picture isn't square (${a.width}×${a.height})`);
    if (a.width < 256) push('error', 'iconPacks', p.id, `${L(p.name)}: tile picture is ${a.width} px, needs 256 px or more`);
    if (a.midColor && contrast('#FFFFFF', a.midColor) < 3) push('warning', 'iconPacks', p.id, `${L(p.name)}: white logos on the tile's middle are ${contrast('#FFFFFF', a.midColor).toFixed(1)}:1, aim for 3:1`);
  });
  pub.festivals.forEach(f => {
    const n = L(f.name);
    if (f.kind === 'festival') {
      const nd = nextDate(f);
      if (!nd) push('error','festivals',f.id,`${n}: has no dates and no fallback date`);
      if (f.occurrences && nd && nd.futureCount < 2) push('warning','festivals',f.id,`${n}: only ${nd.futureCount} future date${nd.futureCount === 1 ? '' : 's'} left in the table`);
      if (f.fallbackDate?.month === 2 && f.fallbackDate?.day === 29) push('error','festivals',f.id,`${n}: fallback date can't be 29 February`);
      const pc = pub.themes.filter(t => t.festivalId === f.id).length;
      if (nd && nd.days <= 30 && pc < 3) push('warning','festivals',f.id,`${n} is in ${nd.days} ${f.unit || 'day'}s and has ${pc} published theme${pc === 1 ? '' : 's'}, aim for 3`);
    }
    if (f.coverThemeId && !themes.has(f.coverThemeId)) push('error','festivals',f.id,`${n}: cover theme "${f.coverThemeId}" isn't in this release`);
  });
  pub.iconPacks.forEach(p => { if (p.kind === 'images' && !p.background) push('error','iconPacks',p.id,`${L(p.name)}: image pack has no background tile, the app would skip it`); });
  pub.fonts.forEach(f => {
    if (!['OFL-1.1','Apache-2.0'].includes(f.license)) push('error','fonts',f.id,`${f.family}: licence must be OFL-1.1 or Apache-2.0`);
    if ((f.files||[]).some(x => x.asset?.format === 'woff2')) push('error','fonts',f.id,`${f.family}: the app can't load WOFF2, upload TTF or OTF`);
    if (f.listed === false) push('info','fonts',f.id,`${f.family} is hidden from the store; themes using it still draw with it`);
  });
  pub.banners.forEach(b => {
    const n = L(b.title) || b.id;
    ['title','subtitle','tag','cta'].forEach(k => { if (!L(b[k])) push('error','banners',b.id,`${n}: ${k} is required`); });
    const a = b.action || {}, map = {theme:themes, festival:fests};
    if (map[a.type] && !map[a.type].has(a.id)) push('error','banners',b.id,`${n}: opens ${a.type} "${a.id}", which isn't in this release`);
    if (a.type === 'url' && !/^https:\/\//.test(a.url || '')) push('error','banners',b.id,`${n}: link must start with https://`);
    if (b.startsAt && b.endsAt && b.endsAt <= b.startsAt) push('error','banners',b.id,`${n}: ends before it starts`);
  });
  const order = {error:0, warning:1, info:2};
  return out.sort((a,b) => order[a.level] - order[b.level]);
}

/* ---------- phone preview (simplified painters) ---------- */

function accentStyle(a){ if (!a) return ''; return a.type === 'gradient' ? `background:linear-gradient(${a.angle ?? 135}deg,${a.colors.join(',')});-webkit-background-clip:text;background-clip:text;color:transparent` : `color:${a.colors[0]}`; }

function themeDownload(t){

}

function fieldHTML([path, label, type, opts, wide], obj, locked){

  if (type === 'wallpic') { const im = obj.image, sm = im?.sizes?.[0]; return `<div class="field wide">${sm ? `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><img class="wallthumb" src="${srcOf(sm.asset)}" alt="Wallpaper picture"><div class="stack" style="gap:4px;font-size:12.5px;min-width:0;flex:1">${im.sizes.map(s => `<div><b class="num">${s.width}×${s.height}</b> <span class="muted">${s.asset.format} · ${kb(s.asset.bytes)}</span> <span class="mono muted">${s.asset.sha256.slice(0,10)}…</span></div>`).join('')}<div class="muted">blurhash <span class="mono">${esc(im.blurhash || '—')}</span></div><div class="muted">dominant <span class="sw" style="background:${im.dominant || 'transparent'}"></span> <span class="mono">${im.dominant || '—'}</span></div><button class="btn sm" data-act="wallPic" style="align-self:flex-start">Replace picture</button></div></div>` : `<button class="btn primary" data-act="wallPic">Upload picture</button>`}</div>`; }

function applyField(el){
  const path = el.dataset.path, t = el.dataset.type, o = E.obj; let v = el.value;
  if (t === 'check') v = el.checked;
  else if (t === 'csv') v = v.split(',').map(s => s.trim()).filter(Boolean);
  else if (t === 'number') v = v === '' ? undefined : Number(v);
  else if (t === 'date') v = v ? v + 'T00:00:00.000Z' : undefined;
  else if (t === 'colorpick') { v = v.toUpperCase(); const txt = el.parentNode.querySelector('input[type=text]'); txt.value = v; }
  else if (t === 'color') { if (v && !isHex(v)) return; if (v) el.parentNode.querySelector('input[type=color]').value = v; v = v ? v.toUpperCase() : undefined; }
  else if (t === 'tcolor') { if (!isHex(v) && !TOKEN_RE.test(v)) return; if (isHex(v)) { el.parentNode.querySelector('input[type=color]').value = v; v = v.toUpperCase(); } }
  else if (t === 'select' || t === 'text' || t === 'id') v = v === '' ? undefined : v;
  if (t === 'csv' && !v.length) v = undefined;
  setP(o, path, v);
  if (path === 'kind' || path === 'scene.engine' || /^scene\.params\.layers\.\d+\.shape$/.test(path)) { normalizeScene(o, E.kind === 'themes'); return rerenderEditor(); }
  if (E.kind === 'themes') refreshThemePreview(); else refreshGenericPreview();
}

function commit(status){

  if (o.id !== E.orig && list.some(x => x.id === o.id)) return toast(`ID "${o.id}" is already used.`);
  const idx = E.orig ? list.findIndex(x => x.id === E.orig) : -1, prev = idx >= 0 ? clone(list[idx]) : null;
  if (prev) { if (prev.status === 'published' && status !== 'published') o.liveCopy = strip(prev); else if (prev.liveCopy) o.liveCopy = prev.liveCopy; }
  if (prev && status === 'ready' && prev.status !== 'review' && prev.status !== 'ready' && JSON.stringify(strip(prev)) === JSON.stringify(strip(o)) && prev.status === 'published') return toast('No changes to approve.');
  if (kind === 'wallpapers' && o.kind === 'image' && !o.image?.sizes?.length) return toast('Upload a picture first.');
  if (kind === 'wallpapers' || kind === 'themes') o.isLive = o.kind === 'image' ? false : sceneLive(o.scene);
  if (kind === 'themes') { commitImageParts(o, status); o.downloadBytes = themeDownload(o).total; }
  o.status = status; o.updatedAt = new Date().toISOString(); o.updatedBy = 'You'; delete o._hue;

  audit({draft:'Saved draft', review:'Requested review', ready:'Approved for release', archived:'Archived'}[status], kind, o.id, prev && strip(prev), strip(o));
  save(); E.orig = o.id; E.obj = clone(o);
  toast({draft:'Draft saved', review:'Sent for review', ready:'Approved. It goes out with the next release.', archived:'Archived. It leaves the catalog at the next release.'}[status]);
  closeModal(); render();
}

  rollbackAsk(d){ confirmBox(`Roll back to ${d.v}?`, `<p>Phones get the older <span class="mono">manifest.json</span> on their next check. Drafts and approved items in the dashboard stay as they are.</p>`, 'Roll back', () => { S.releases.forEach(r => r.current = r.version === d.v); S.cat.catalogVersion = d.v; audit('Rolled back', 'release', d.v); save(); closeModal(); render(); toast(`Live catalog is now ${d.v}`); }); },
  exportRelease(d){ const r = S.releases.find(x => x.version === d.v); E = null; showJSON(`catalog.${r.version}.json`, r.snap); },
  resetAsk(){ confirmBox('Reset demo data?', '<p>This restores the mock catalog and clears drafts, releases and the audit log made in this browser.</p>', 'Reset', () => { try { localStorage.removeItem(KEY); } catch(e){} fresh(); save(); closeModal(); render(); toast('Demo data reset'); }); },
  wGen(){ wGen(); }, wBack(){ W.step = 1; renderWizard(); },
  wShuffle(d){ const s = seedNew(), o = genTheme({...W.inp, hue: W.opts[d.n]._hue}, s); o._seed = s; W.opts[d.n] = o; renderWizard(); },
  wMore(d){ const keep = W.opts[d.n]; wGen(keep._hue); W.opts[0] = keep; renderWizard(); },
  wUse(d){ const o = W.opts[d.n]; o.generatedFrom = {festivalId:W.inp.festivalId, mood:W.inp.mood, base:W.inp.base || null, seed:o._seed, desc:W.inp.desc || undefined}; delete o._seed; delete o._hue; while (S.cat.themes.some(t => t.id === o.id)) o.id += '-2'; W = null; E = {kind:'themes', orig:null, obj:o, pv:{mode:'lock', shape:'', labelColor:'theme', labelFont:'theme', accent:0}}; renderThemeEditor(); toast('Option filled in. Adjust it, then save the draft.'); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { if (a.tagName === 'BUTTON' || a.dataset.act !== 'filterFest') e.preventDefault(); if (a.disabled) return; ACT[a.dataset.act]?.(a.dataset); return; }
  if (e.target.matches('[data-picker]')) { closePicker(); return; }
  if (e.target.matches('[data-scrim]') && !document.querySelector('[data-confirm]') && !PICK) { closeModal(); W = null; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.path && E) return applyField(el);
  if (el.dataset.i && E?.img) {
    const k = el.dataset.i, I = E.img; I[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'shape') { I.touched = true; return refreshThemePreview(); }
    if (k === 'addLive') { I.touched = true; return; }
    buildFromImages(k === 'match' && I.match); return rerenderEditor();
  }
  if (el.dataset.wall && E) { const ids = new Set(E.obj.wallpaperIds || []); el.checked ? ids.add(el.dataset.wall) : ids.delete(el.dataset.wall); E.obj.wallpaperIds = [...ids]; return; }
  if (el.dataset.filter) { UI.themeF[el.dataset.filter] = el.value; const pos = el.selectionStart; render(); const n = document.getElementById(el.id); if (n) { n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); } return; }
  if (el.dataset.w && W) { if (el.dataset.w === 'pick') W.inp.base = el.checked ? '' : $('#wB').value; else if (el.dataset.w === 'base') { W.inp.base = el.value; $('#wP').checked = false; } else W.inp[el.dataset.w] = el.value; return; }
  if (el.hasAttribute('data-bdate')) { UI.bannerDate = el.value || new Date().toISOString().slice(0,10); render(); $('#bdate')?.focus(); return; }
  if (el.hasAttribute('data-ack')) { UI.ackWarn = el.checked; render(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.upload && e.target.files?.[0]) { handleUpload(e.target.files[0], e.target.dataset.upload); e.target.value = ''; return; }
  if (e.target.dataset.path && E && e.target.dataset.type === 'check') applyField(e.target);
});
document.addEventListener('dragover', e => { const d = e.target.closest?.('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => e.target.closest?.('.drop')?.classList.remove('over'));
document.addEventListener('drop', e => { const d = e.target.closest?.('.drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer?.files?.[0], inp = d.querySelector('input[data-upload]'); if (f && inp) handleUpload(f, inp.dataset.upload); });
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.form === 'addSearch') { const v = $('#sNew').value.trim(); if (v) { S.cat.searchSuggestions.push(v); audit('Added popular search', 'store', v); save(); render(); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (PICK) closePicker(); else if (document.querySelector('[data-confirm]')) ACT.confirmNo(); else if ($('#modal').innerHTML) { closeModal(); W = null; } } });
window.addEventListener('hashchange', setRoute);

load(); setRoute();
analyseSeeds().then(() => { if (['publish','images','iconPacks','overview'].includes(route)) render(); });
</script>
